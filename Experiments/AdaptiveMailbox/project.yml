name: AdaptiveMailboxDemo
options:
  bundleIdPrefix: dev.ledwardchow.experimental
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
targets:
  AdaptiveMailboxDemo:
    type: application
    platform: iOS
    sources: [Sources/AdaptiveMailbox, Demo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ledwardchow.experimental.AdaptiveMailboxDemo
        INFOPLIST_KEY_CFBundleDisplayName: Mail Layout Lab
  AdaptiveMailboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AdaptiveMailboxDemo
schemes:
  AdaptiveMailboxDemo:
    build:
      targets:
        AdaptiveMailboxDemo: all
    test:
      targets: [AdaptiveMailboxUITests]
